services:
  - type: web
    name: compintel-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 5000
